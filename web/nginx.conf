server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Appels à l'API transmis au conteneur « api » : le navigateur ne parle qu'à une seule origine,
    # donc pas de configuration CORS côté API.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application monopage : toute URL inconnue renvoie index.html, le router Angular prend le relais.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

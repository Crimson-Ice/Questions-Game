<main class="mx-auto mt-16 max-w-sm px-4">
  <h2 class="mb-6 text-2xl font-semibold">Connexion au back-office</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="flex flex-col gap-4">
    <label class="flex flex-col gap-1">
      <span>E-mail</span>
      <input type="email" formControlName="email" autocomplete="username" class="rounded border px-3 py-2" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="text-sm text-red-600">Saisissez une adresse e-mail valide.</span>
      }
    </label>

    <label class="flex flex-col gap-1">
      <span>Mot de passe</span>
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        class="rounded border px-3 py-2"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="text-sm text-red-600">Le mot de passe est obligatoire.</span>
      }
    </label>

    @if (error(); as message) {
      <p role="alert" class="text-red-600">{{ message }}</p>
    }

    <button
      type="submit"
      [disabled]="submitting()"
      class="rounded bg-blue-600 px-4 py-2 font-medium text-white disabled:opacity-50"
    >
      {{ submitting() ? 'Connexion…' : 'Se connecter' }}
    </button>
  </form>
</main>
